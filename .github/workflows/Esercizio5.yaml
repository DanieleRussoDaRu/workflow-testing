name: Esercizio 5 - Multidimensional matrix
on: [workflow_dispatch]

jobs:
  build-and-test:
    strategy:
      matrix: 
        os: [ubuntu-latest, windows-latest]
        dotnet-version: ["8.0.x", "9.0.x"]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: .NET configuration
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Print result
        run: echo "Building on OS: ${{ matrix.os }} with .NET ${{ matrix.dotnet-version }}"
