name: Esercizio 4 - Matrix
on: push

jobs:
  test-matrix:
    strategy: 
      matrix:
        node-version: ["18", "20"]
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Node js configuration
        uses: actions/setup-node@v4 
        with: 
          node-version: ${{ matrix.node-version }}
      
      - name: Print version
        run: echo "Im executing test on Node.js version ${{ matrix.node-version }}"
